name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  # Explicit permissions blocks set every unlisted scope to "none", not to
  # a default -- actions/*-artifact and codeql-action/upload-sarif both
  # call the Actions API internally, so this is needed regardless of the
  # note on upload-sarif steps below.
  actions: read

jobs:
  # ---------------------------------------------------------------------
  # Trivy: filesystem scan (npm dependency vulnerabilities) + config scan
  # (terraform/ IaC misconfigurations). Both write SARIF; findings never
  # fail this job by themselves (exit-code 0) — the dedicated gate job
  # below is the actual enforcement point.
  # ---------------------------------------------------------------------
  trivy:
    name: Trivy (filesystem + IaC config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan (npm dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Trivy config scan (terraform/)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          # Trivy looks for .trivyignore relative to its own working
          # directory (repo root here), not the scan-ref subdirectory --
          # has to be pointed at explicitly or terraform/.trivyignore is
          # silently never read.
          trivyignores: terraform/.trivyignore
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      # continue-on-error: this repo is private without GitHub Advanced
      # Security enabled, so the Security tab isn't available yet --
      # upload-sarif 403s with "Code scanning is not enabled for this
      # repository." That's a plan/visibility decision, not a workflow
      # bug, so it shouldn't fail the job or block the artifact upload
      # below (which is what the gate job actually reads). Once GHAS is
      # enabled (or the repo goes public), this starts working with no
      # workflow change needed.
      - name: Upload Trivy filesystem SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy config SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Save SARIF files for the gate job
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: |
            trivy-fs.sarif
            trivy-config.sarif
          retention-days: 14

  # ---------------------------------------------------------------------
  # Checkov: IaC misconfiguration scan for terraform/. soft_fail so a
  # finding doesn't fail this job — the gate job enforces instead.
  # ---------------------------------------------------------------------
  checkov:
    name: Checkov (IaC config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true

      # continue-on-error: see the note on the Trivy upload-sarif steps --
      # same 403 (code scanning / GHAS not enabled on this private repo),
      # not a workflow bug.
      - name: Upload Checkov SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Save SARIF file for the gate job
        uses: actions/upload-artifact@v7
        with:
          name: checkov-sarif
          path: checkov.sarif
          retention-days: 14

  # ---------------------------------------------------------------------
  # Gitleaks: full git history scan for leaked secrets. Run via the
  # official Docker image directly (rather than a marketplace action) so
  # the report path/args are explicit. exit-code 0 so a finding doesn't
  # fail this job — Gitleaks is not part of the enforcement gate per the
  # spec (Trivy/Checkov Critical/High only), it's informational via the
  # Security tab.
  # ---------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the last commit

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 0

      # continue-on-error: see the note on the Trivy upload-sarif steps --
      # same 403 (code scanning / GHAS not enabled on this private repo),
      # not a workflow bug.
      - name: Upload Gitleaks SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------
  # npm audit: baseline dependency check, plain output, informational
  # only (no SARIF, not part of the gate). Repo has no package.json today
  # — skip cleanly instead of failing if one hasn't been added yet.
  # ---------------------------------------------------------------------
  npm-audit:
    name: npm audit (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run npm audit
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json at repo root — nothing for npm audit to check yet."
            exit 0
          fi
          npm audit || true

  # ---------------------------------------------------------------------
  # Enforcement gate. Runs after all four scanners and fails the workflow
  # if Trivy or Checkov reported any Critical or High severity finding.
  # This is the actual blocking check — the scanner jobs above are
  # deliberately non-blocking so their SARIF still uploads either way.
  # ---------------------------------------------------------------------
  security-gate:
    name: Security Gate (Critical/High)
    runs-on: ubuntu-latest
    needs: [trivy, checkov, gitleaks, npm-audit]
    if: always()
    steps:
      # continue-on-error: a scanner job that failed outright (crashed
      # before it could upload its artifact) shouldn't crash the gate job
      # here -- check_sarif below already treats a missing file as "skip
      # with a warning", but only if the gate job survives long enough to
      # reach that script.
      - name: Download Trivy SARIF
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: trivy-sarif
          path: sarif/trivy

      - name: Download Checkov SARIF
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: checkov-sarif
          path: sarif/checkov

      - name: Fail on Critical/High findings
        run: |
          fail=0

          check_sarif() {
            local file="$1"
            local label="$2"
            local trust_level="$3" # "true" if this tool's SARIF `level` field is verified to track real severity
            if [ ! -f "$file" ]; then
              echo "::warning::$label SARIF not found ($file) — skipping"
              return
            fi
            # A result counts as Critical/High if it carries an explicit
            # CRITICAL/HIGH severity tag or a security-severity score >= 7.0
            # -- and, only for tools verified to encode real severity via
            # SARIF `level` (Trivy: confirmed error/warning/note varies with
            # actual CRITICAL/HIGH/MEDIUM/LOW), level == "error" too.
            #
            # Checkov's open-source SARIF output does NOT carry this: every
            # finding comes back `level: error, properties: null` with zero
            # severity metadata regardless of actual risk (verified against
            # real output, not assumed) -- treating that as Critical/High
            # would make the gate fail on every single Checkov finding ever,
            # which isn't what "Critical/High only" means. Its findings
            # still upload to the Security tab (once GHAS is enabled) and
            # the build artifact either way, just not as a gate input until
            # Checkov's SARIF actually carries severity.
            count=$(jq --arg trust_level "$trust_level" '
              [ .runs[].results[]?
                | select(
                    (($trust_level == "true") and (.level == "error"))
                    or ((.properties.tags // []) | any(. == "CRITICAL" or . == "HIGH"))
                    or ((.properties["security-severity"] // "0" | tonumber) >= 7.0)
                  )
              ] | length
            ' "$file")
            echo "$label: $count Critical/High finding(s)"
            if [ "$count" -gt 0 ]; then
              fail=1
            fi
          }

          check_sarif sarif/trivy/trivy-fs.sarif "Trivy (filesystem)" true
          check_sarif sarif/trivy/trivy-config.sarif "Trivy (config)" true
          check_sarif sarif/checkov/checkov.sarif "Checkov" false

          if [ "$fail" -eq 1 ]; then
            echo "::error::Critical or High severity finding(s) detected by Trivy or Checkov — failing the gate."
            exit 1
          fi

          echo "No Critical/High findings from Trivy or Checkov. Gate passed."
